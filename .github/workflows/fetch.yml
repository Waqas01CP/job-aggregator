name: fetch

# Twice daily, ADR-0006. Times are UTC; Pakistan is UTC+5 with no daylight
# saving, so these are 05:00 and 18:00 PKT.
#
#   00:00 UTC = 05:00 PKT, early morning, catching postings published
#               overnight during North American and European working hours.
#   13:00 UTC = 18:00 PKT, early evening, catching postings published by
#               Pakistani employers during their working day.
#
# GitHub documents scheduled runs as best-effort: they may be delayed or
# dropped under load, with no error. ADR-0007 absorbs that, because nothing is
# filtered on publication date at fetch time, so a missed run costs latency
# rather than data.

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Write to alternate files, leaving production data alone"
        type: boolean
        default: false

# Two runs must never write the data branch at once. A queued run waits rather
# than being cancelled, because cancelling would drop the fetch entirely.
# cancel-in-progress protects the running one and queue: max the waiting ones:
# without it GitHub keeps one pending run per group and cancels it when a
# third arrives, which the contract check sharing this group made likelier.
# The audit of 2026-09-24, F3, against GitHub's concurrency documentation.
concurrency:
  group: fetch
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A test run writes and pushes its own branch. It keeps production's layout
    # inside it, so sharing the production branch would put test files on
    # production paths. src/storage.py names the same two branches and
    # tests/test_workflow.py holds them in step.
    #
    # TEST_MODE is deliberately not set here. At job level the test step saw
    # it too, and run 35236457737 failed its own tests with TEST_MODE=1. It is
    # set on the Fetch step only.
    env:
      DATA_BRANCH: ${{ inputs.test_mode && 'data-test' || 'data' }}
      # The other mode's branch, fetched only so the run can count the
      # month's Airtable calls across the workspace. Never pushed.
      OTHER_BRANCH: ${{ inputs.test_mode && 'data' || 'data-test' }}

    # Action versions are the lowest majors that run on Node 24. Run
    # 35179218050 warned that checkout@v4 and setup-python@v5 target Node 20
    # and were being forced onto 24. checkout v5's only change was the runtime;
    # v6 moved persisted credentials to a separate file, which the push step
    # below depends on, so it is left for a change that can be tested on its
    # own. Checked 2026-09-17 against each tag's action.yml and release notes.
    steps:
      - uses: actions/checkout@v5
        with:
          # The data branch is orphan and is never checked out. The run writes
          # it with plumbing, so only main is needed here.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run the tests before touching a live board
        run: python -m unittest discover -s tests -t .

      # The checkout holds main only. The run appends to what the branch
      # already stores, so the branch is fetched first; without it every run is
      # first contact and its commit starts a new history that the push then
      # cannot fast-forward. ls-remote exits 2 for "no such branch", which is
      # the first run ever, and anything else for a failure to ask.
      - name: Fetch the data branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$DATA_BRANCH" >/dev/null
          found=$?
          set -e
          case "$found" in
            0) git fetch --no-tags --depth=1 origin "refs/heads/$DATA_BRANCH:refs/heads/$DATA_BRANCH" ;;
            2) echo "origin has no $DATA_BRANCH branch yet; this run starts it" ;;
            *) echo "::error::could not ask origin whether $DATA_BRANCH exists"; exit 1 ;;
          esac

      # Airtable's monthly allowance is per workspace, and test runs spend it
      # too, so the run reads the month's run logs from both branches. The
      # operator's go of 2026-09-24, G7. Read only: nothing here pushes it.
      - name: Fetch the other data branch, for the month's Airtable count
        run: |
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$OTHER_BRANCH" >/dev/null
          found=$?
          set -e
          case "$found" in
            0) git fetch --no-tags --depth=1 origin "refs/heads/$OTHER_BRANCH:refs/heads/$OTHER_BRANCH" ;;
            2) echo "origin has no $OTHER_BRANCH branch; the count covers this branch only" ;;
            *) echo "::error::could not ask origin whether $OTHER_BRANCH exists"; exit 1 ;;
          esac

      # The secrets reach this step and no other. Set at job level they would
      # reach the test step too, which is how a job-level TEST_MODE broke run
      # 35236457737; tests use a fake transport and need none of them.
      - name: Fetch
        id: fetch
        env:
          TEST_MODE: ${{ inputs.test_mode && '1' || '0' }}
          # ADR-0048: which scheduled slot fired this run, so a source polled
          # once a day is asked on the morning run only. A dispatch is neither
          # slot and polls every source.
          RUN_SLOT: ${{ github.event.schedule == '0 0 * * *' && 'morning' || github.event.schedule == '0 13 * * *' && 'evening' || 'manual' }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
          AIRTABLE_TEST_TABLE_ID: ${{ secrets.AIRTABLE_TEST_TABLE_ID }}
          AGGREGATOR_STORE_TOKEN: ${{ secrets.AGGREGATOR_STORE_TOKEN }}
          AGGREGATOR_STORE_REPO: ${{ secrets.AGGREGATOR_STORE_REPO }}
          # ADR-0050's sweep: the three classification tables, production and
          # test. A run reads only its own mode's three.
          AIRTABLE_NOT_A_FIT_TABLE_ID: ${{ secrets.AIRTABLE_NOT_A_FIT_TABLE_ID }}
          AIRTABLE_POOR_FILTERING_TABLE_ID: ${{ secrets.AIRTABLE_POOR_FILTERING_TABLE_ID }}
          AIRTABLE_ACCEPTED_TABLE_ID: ${{ secrets.AIRTABLE_ACCEPTED_TABLE_ID }}
          AIRTABLE_NOT_A_FIT_TEST_TABLE_ID: ${{ secrets.AIRTABLE_NOT_A_FIT_TEST_TABLE_ID }}
          AIRTABLE_POOR_FILTERING_TEST_TABLE_ID: ${{ secrets.AIRTABLE_POOR_FILTERING_TEST_TABLE_ID }}
          AIRTABLE_ACCEPTED_TEST_TABLE_ID: ${{ secrets.AIRTABLE_ACCEPTED_TEST_TABLE_ID }}
        run: |
          set +e
          python -m src.run
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Three exit codes, and only one of them is a failure.
          #   0 finished
          #   2 resumable: the budget was reached, the circuit opened, the
          #     projection to Airtable failed, or the private store could not
          #     be restored or written (ADR-0047, the operator's D6). The run
          #     log names which, the public fetch is committed, and the next
          #     run picks it up; the next projection sends the whole layer
          #     again.
          #   1 failed: either it could not start, or it fetched and could not
          #     store the result. The run's own output above says which.
          if [ "$code" -eq 1 ]; then
            echo "::error::the run failed with exit 1; its output above says whether it could not start or could not store a completed fetch"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::the run is resumable: it stopped early on the request budget or the circuit breaker, its projection to Airtable failed, or the private store could not be restored or written; the run log says which"
          fi
          exit 0

      - name: Push the data branch
        if: steps.fetch.outputs.exit_code != '1'
        run: |
          if git rev-parse --verify --quiet "refs/heads/$DATA_BRANCH" >/dev/null; then
            git push origin "refs/heads/$DATA_BRANCH:refs/heads/$DATA_BRANCH"
          else
            echo "no $DATA_BRANCH branch was written, so nothing to push"
          fi

      # The operator's decisions of 2026-09-24. A failed projection exits 2
      # and shows green, so one that repeats would look healthy: on the third
      # run in a row it is marked failed. A private-store failure is marked
      # failed on the first (D9), since it needs fixing. Either way the run has
      # committed and the step above has pushed before this runs. It must stay the last step, after the
      # push, so marking a run failed can never cost it its data.
      - name: Fail the run if it needs attention
        if: steps.fetch.outputs.escalate == 'true'
        run: |
          echo "::error::the private store failed on this run, or the projection to Airtable has failed three runs in a row; the data is committed and pushed, and the run log names the failure"
          exit 1
