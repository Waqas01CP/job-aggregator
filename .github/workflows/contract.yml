name: contract

# ADR-0018 and ADR-0036: once a day, one response per platform, fingerprinted
# over the fields each adapter consumes and compared with the last check. A
# change is written to the check's own log on the data branch and the run
# still succeeds; the run fails when the check itself does, or, after its
# push, when one platform's check failed (ADR-0059). Daily is the operator's
# cadence, ADR-0036's Changes.
#
# 06:30 UTC, 11:30 PKT, sits between the fetch runs at 00:00 and 13:00 UTC, so
# neither waits for the other in the shared concurrency group below.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Read and write the data-test branch, leaving production alone"
        type: boolean
        default: false

# The same group as the fetch: both write the data branch, and two pushes to
# it at once would refuse one of them. queue: max, as in fetch.yml, so a
# waiting fetch is never cancelled to make room for this.
concurrency:
  group: fetch
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  contract:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26 from
    # 2026-10-19, and Python 3.11, which this pins, is untested there. Moved
    # deliberately, after a test run on the new image, never by the label.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      DATA_BRANCH: ${{ inputs.test_mode && 'data-test' || 'data' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run the tests before asking a live board
        # Workflow commands are switched off while the tests run. A test that
        # prints a warning command otherwise becomes an annotation on the run: one
        # did on every run of 2026-10-02, a disagreement that never happened.
        run: |
          token="tests-$(date +%s%N)"
          echo "::stop-commands::$token"
          set +e
          python -m unittest discover -s tests -t .
          status=$?
          echo "::$token::"
          exit $status

      # As in fetch.yml: the check reads the last fingerprint from the branch
      # and commits the next one on top, so the branch is fetched first.
      - name: Fetch the data branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$DATA_BRANCH" >/dev/null
          found=$?
          set -e
          case "$found" in
            0) git fetch --no-tags --depth=1 origin "refs/heads/$DATA_BRANCH:refs/heads/$DATA_BRANCH" ;;
            2) echo "origin has no $DATA_BRANCH branch yet; this check starts it" ;;
            *) echo "::error::could not ask origin whether $DATA_BRANCH exists"; exit 1 ;;
          esac

      # No secret reaches this step: every board it asks is public.
      - name: Check
        id: check
        env:
          TEST_MODE: ${{ inputs.test_mode && '1' || '0' }}
        run: |
          set +e
          python -m src.contract
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          #   0 checked, every finding in the log
          #   2 one platform's check failed (ADR-0059): its last fingerprint
          #     stands, the others' findings are committed, and the step
          #     after the push marks the run failed
          #   1 the check itself failed and committed nothing
          if [ "$code" -eq 1 ]; then
            echo "::error::the contract check itself failed and committed nothing; this is not a finding about any board"
            exit 1
          fi
          exit 0

      - name: Push the data branch
        if: steps.check.outputs.exit_code != '1'
        run: |
          if git rev-parse --verify --quiet "refs/heads/$DATA_BRANCH" >/dev/null; then
            git push origin "refs/heads/$DATA_BRANCH:refs/heads/$DATA_BRANCH"
          else
            echo "no $DATA_BRANCH branch was written, so nothing to push"
          fi

      # ADR-0059: a platform whose check failed must not look healthy, and
      # marking it must not cost the others their findings, so this is the
      # last step, after the push, as in fetch.yml.
      - name: Fail the run if a platform's check failed
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "::error::a platform's contract check failed; the other platforms' findings are committed and pushed, and the log names where it raised"
          exit 1
